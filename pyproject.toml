[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mixmargin"
version = "0.1.0"
description = "Exact empirical accuracy-margin bounds under declared group-mixture constraints"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Anish Pentyala"}]

[project.scripts]
mixmargin = "mixmargin:entrypoint"

[tool.setuptools]
py-modules = ["mixmargin"]
